<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uma cartinha pra você</title>
<meta name="description" content="Tem um pedido especial dentro deste envelope.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='6' width='28' height='21' rx='4' fill='%232c52d3'/%3E%3Cpath d='M3 8l13 10L29 8' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5ff;color:#203783;font-family:Georgia,'Times New Roman',serif;min-height:100svh}main{min-height:100svh;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;padding:40px 20px;background:radial-gradient(ellipse at 50% 48%,#fff 0%,#f3f5ff 65%)}.eyebrow{font:500 12px/1.4 Arial,sans-serif;letter-spacing:.23em;text-transform:uppercase;margin:0 0 18px}h1{font-size:clamp(30px,6vw,48px);font-weight:400;letter-spacing:-.04em;margin:0;text-align:center}.stage{position:relative;width:min(360px,82vw);height:360px;display:flex;align-items:flex-end;padding-bottom:22px;margin-top:24px;perspective:1000px}.envelope{position:relative;width:100%;height:220px;border:0;padding:0;background:#3457c5;border-radius:6px;cursor:pointer;box-shadow:0 22px 36px -20px #19398780;text-align:initial;isolation:isolate;-webkit-tap-highlight-color:transparent}.envelope:focus-visible{outline:3px solid #14296d;outline-offset:12px}.back{position:absolute;inset:0;border-radius:6px;background:#2948ad}.letter{position:absolute;left:6%;bottom:12px;width:88%;height:204px;border-radius:3px;background:#fffdf8;box-shadow:0 0 10px #10265a15;padding:24px 20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;opacity:0;transition:transform .8s cubic-bezier(.22,.8,.22,1),opacity .2s;transition-delay:0s;z-index:1}.letter small{font:11px Arial,sans-serif;letter-spacing:.18em;color:#7884a6;margin-bottom:15px}.letter p{font:italic 28px/1.22 Georgia,serif;color:#243c87;margin:0}.letter .heart{font-size:21px;color:#d34b67;margin-top:13px}.front{position:absolute;inset:0;z-index:3;overflow:hidden;border-radius:5px;background:linear-gradient(90deg,#4165da 50%,#3c60d4 50%);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);pointer-events:none}.front:after{content:'';position:absolute;inset:0;background:#4c6edf;clip-path:polygon(0 100%,0 96%,50% 42%,100% 96%,100% 100%)}.flap{position:absolute;inset:0;background:#6383ef;clip-path:polygon(0 0,100% 0,50% 59%);transform-origin:top;transition:transform .5s ease,z-index 0s .25s;z-index:4;border-radius:5px}.seal{position:absolute;left:calc(50% - 22px);top:99px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#eaf0ff;color:#3554b4;font:20px Georgia,serif;z-index:5;box-shadow:0 2px 4px #1f399c30;transition:opacity .2s}.address{position:absolute;bottom:26px;width:100%;text-align:center;color:#eef2ff;font:italic 16px Georgia,serif;z-index:4;pointer-events:none}.envelope.open .flap{transform:rotateX(180deg);z-index:0}.envelope.open .letter{opacity:1;transform:translateY(-157px);transition-delay:.3s}.envelope.open .seal{opacity:0}.hint{font:14px/1.5 Arial,sans-serif;color:#67749b;text-align:center;margin:18px 0 0}.footer{margin-top:55px;color:#8b95b2;font:12px Arial,sans-serif;letter-spacing:.06em}@media(max-width:400px){.stage{height:335px}.envelope{height:200px}.letter p{font-size:25px}.seal{top:89px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;transition-delay:0s!important}}
</style>
</head>
<body><main>
<p class="eyebrow">correio especial</p><h1>Tem uma cartinha pra você.</h1>
<div class="stage"><button class="envelope" id="envelope" aria-label="Abrir envelope" aria-expanded="false" aria-controls="letter">
<span class="back"></span><span class="letter" id="letter" aria-hidden="true"><small>UM PEDIDO ESPECIAL</small><p>Me empresta o podzin por favor?</p><span class="heart" aria-hidden="true">♥</span></span><span class="front"></span><span class="flap"></span><span class="seal" aria-hidden="true">♡</span><span class="address">para: você</span>
</button></div>
<p class="hint" id="hint">Toque no envelope para abrir.</p><span class="footer">feito com carinho e segundas intenções musicais</span>
</main><script>
const envelope=document.getElementById('envelope');
envelope.addEventListener('click',()=>{const open=envelope.classList.toggle('open');envelope.setAttribute('aria-expanded',String(open));envelope.setAttribute('aria-label',open?'Fechar envelope':'Abrir envelope');document.getElementById('letter').setAttribute('aria-hidden',String(!open));document.getElementById('hint').textContent=open?'Toque de novo para guardar a cartinha.':'Toque no envelope para abrir.';});
</script></body></html>
